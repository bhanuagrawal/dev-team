<style>
    @keyframes breathe {
      0%, 100% {
        transform: scale(0.7);
        opacity: 0.4;
      }
      50% {
        transform: scale(1.1);
        opacity: 0.9;
      }
    }
    .animate-breathe {
      animation: breathe 6s ease-in-out infinite;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-row-label min-h-screen flex flex-col justify-between selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-dim flex justify-between items-center w-full px-gutter py-space-sm z-50">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim text-[24px]">spa</span>
<h1 class="font-screen-title text-screen-title font-bold text-primary dark:text-primary-fixed-dim">MindfulLauncher</h1>
</div>
<div class="font-row-subtitle text-row-subtitle text-on-surface-variant">Mindful Pause</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-gutter text-center relative overflow-hidden my-auto">
<!-- Ambient Glow Background Element -->
<div class="absolute w-72 h-72 rounded-full bg-primary-container/10 blur-3xl pointer-events-none animate-breathe"></div>
<!-- App Name Subtitle -->
<div class="font-row-subtitle text-row-subtitle text-on-surface-variant tracking-widest uppercase mb-space-sm opacity-80">
      Instagram
    </div>
<!-- Instruction text -->
<h2 class="font-screen-title text-screen-title text-on-surface mb-space-xl font-normal">
      Take a breath before you continue
    </h2>
<!-- Centered Breathing Circle & Countdown -->
<div class="relative w-64 h-64 md:w-80 md:h-80 flex items-center justify-center my-space-lg">
<!-- Outer expanding ring -->
<div class="absolute inset-0 rounded-full border-2 border-primary-container/30 animate-breathe"></div>
<!-- Inner glowing ring -->
<div class="absolute inset-4 rounded-full border border-primary/50 shadow-[0_0_30px_rgba(45,212,191,0.15)]"></div>
<!-- Countdown numeral -->
<div class="font-clock-display text-clock-display text-primary z-10 select-none" id="countdown">
        05
      </div>
</div>
<!-- Intent prompt -->
<p class="font-row-label text-row-label text-on-surface-variant max-w-xs mt-space-md">
      Notice how you feel. Is this action aligned with your current intention?
    </p>
</main>
<!-- Footer / Close Action Area -->
<footer class="w-full px-gutter py-space-xl flex flex-col items-center justify-center z-50">
<button class="opacity-40 cursor-not-allowed transition-all duration-300 bg-surface-highest text-on-surface-variant px-space-xl py-space-sm rounded-xl font-cta-button text-cta-button flex items-center gap-2" disabled="" id="close-btn">
<span class="material-symbols-outlined text-[18px]">lock</span>
      Pause in progress...
    </button>
</footer>
<script>
    let timeLeft = 5;
    const countdownEl = document.getElementById('countdown');
    const closeBtn = document.getElementById('close-btn');

    const timer = setInterval(() => {
      timeLeft--;
      if (timeLeft > 0) {
        countdownEl.textContent = timeLeft < 10 ? '0' + timeLeft : timeLeft;
      } else {
        clearInterval(timer);
        countdownEl.textContent = '00';
        closeBtn.disabled = false;
        closeBtn.classList.remove('opacity-40', 'cursor-not-allowed', 'bg-surface-highest', 'text-on-surface-variant');
        closeBtn.classList.add('bg-primary-container', 'text-on-primary-container', 'hover:opacity-90', 'cursor-pointer');
        closeBtn.innerHTML = '<span class="material-symbols-outlined text-[18px]">arrow_forward</span> Continue to App';
        
        closeBtn.addEventListener('click', () => {
          window.location.reload();
        });
      }
    }, 1000);
  </script>
</body></html>
