# CANONICAL CI: one signed AAB per app → Play internal testing.
#
# Every project uses this exact file; the four __PLACEHOLDERS__ are filled from the
# project's profile `ci` block by `devteam ci <project> --write`. Do not hand-edit a
# project's copy — change this template, then re-render all projects.
#
# WHY ONE SHAPE (owner directive 2026-10-31): projects had diverged into tag-
# triggered and bump-triggered variants, one of them carried a production-promotion
# workflow, and their upload steps differed in ways nobody could review. One trigger
# (a version tag), one job, one upload to `internal`.
#
# Production promotion is NEVER part of CI. It is a human action in Play Console.
name: Release to Play (internal)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name to build (e.g. 1.4.1). Leave empty to use the tag.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Secret availability is read through an env var: `if:` cannot test a secret
    # directly, and an unset secret must mean "build only", not "fail".
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # versionName = tag without the leading 'v' (v1.3 -> 1.3), or the manual input
      # versionCode = semver encoding            (1.3 -> 10300)
      - name: Compute version
        run: |
          if [ -n "${{ inputs.version_name }}" ]; then
            TAG="${{ inputs.version_name }}"
          else
            TAG="${GITHUB_REF_NAME#v}"
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG"
          PATCH="${PATCH:-0}"
          echo "VERSION_NAME=$TAG" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_ENV"

      - name: Restore keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.jks"
          cat > "$GITHUB_WORKSPACE/keystore.properties" <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build release AAB
        env:
          VERSION_NAME: ${{ env.VERSION_NAME }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
        run: ./gradlew __BUNDLE_TASKS__

      - name: Upload AAB as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.VERSION_NAME }}
          path: __RELEASE_FILES__

      - name: Keep the release note inside Play's limit
        run: |
          python3 - <<'EOF'
          import pathlib
          p = pathlib.Path("__WHATSNEW_FILE__")
          if not p.exists():
              print("no whatsnew file — Play will show nothing new")
          else:
              text = p.read_text(encoding="utf-8")
              limit = __WHATSNEW_LIMIT__
              if len(text) > limit:
                  p.write_text(text[:limit], encoding="utf-8")
                  print(f"Truncated from {len(text)} to {limit} chars")
              else:
                  print(f"OK: {len(text)} chars")
          EOF

      # Staged on purpose: with no Play service account the build still goes green and
      # the AAB stays as an artifact, so a fresh project ships nothing by accident.
      - name: Upload to Play Console (internal testing)
        if: env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_JSON }}
          packageName: __PACKAGE_NAME__
          releaseFiles: __RELEASE_FILES__
          tracks: internal
          status: completed
          whatsNewDirectory: __WHATSNEW_DIR__
