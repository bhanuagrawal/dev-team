# CANONICAL CI: one signed AAB per app → Play internal testing.
#
# Every project uses this exact file; the placeholders are filled from the
# project's profile `ci` block by `devteam ci <project> --write`.
# Do not hand-edit a project's copy — change this template, then re-render all
# projects.
#
# TEMPLATE_VERSION 2 — the version is READ FROM THE RELEASE COMMIT, not derived
# from the tag. `devteam release` writes versionName/versionCode into the version
# file and tags the commit that carries them, so there is exactly one author of
# the number (v1: CI re-derived it from the tag string and did arithmetic on it,
# which broke the moment a name carried a prerelease, e.g. 1.0.9-rc.1).
#
# WHY ONE SHAPE (owner directive 2026-10-31): projects had diverged into tag-
# triggered and bump-triggered variants, one of them carried a production-promotion
# workflow, and their upload steps differed in ways nobody could review. One trigger
# (a version tag), one job, one upload to `internal`.
#
# Production promotion is NEVER part of CI. It is a human action in Play Console.
name: Release to Play (internal)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name to build (e.g. 1.4.1). Leave empty to use the tag.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Secret availability is read through an env var: `if:` cannot test a secret
    # directly, and an unset secret must mean "build only", not "fail".
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # The version is whatever the release commit stamped, verbatim. No parsing
      # of the tag, no arithmetic on the name: `1.0.9-rc.1` is a legal value and
      # `versionCode` was already allocated above Play's floor by `devteam release`.
      # A manual dispatch may still override the NAME (hotfix builds), and then the
      # committed code is reused — which is safe because a used code is caught by
      # the upload, loudly, not silently.
      - name: Read version from the release commit
        run: |
          python3 - "$GITHUB_ENV" <<'EOF'
          import pathlib, re, sys
          out = pathlib.Path(sys.argv[1])
          gf = pathlib.Path("__VERSION_FILE__")
          lines = gf.read_text(encoding="utf-8").splitlines() if gf.is_file() else []
          def line_with(word):
              return next((ln for ln in lines if word in ln), "")
          name_line, code_line = line_with("versionName"), line_with("versionCode")
          names = re.findall(r"[\"']([^\"']+)[\"']", name_line)
          version_rx = r"\d+\.\d+(\.\d+)?(-[0-9A-Za-z][0-9A-Za-z.-]*)?"
          name = next((n for n in reversed(names) if re.fullmatch(version_rx, n)), None)
          codes = re.findall(r"(?<![\w.])(\d+)(?![\w.])", code_line)
          code = codes[-1] if codes else None
          if not name or not code:
              sys.exit(f"cannot read versionName/versionCode from {gf} (name={name!r}, "
                       f"code={code!r}) - the release commit must carry both literals; "
                       "see `devteam release`")
          override = "${{ inputs.version_name }}"
          if override:
              name = override
              print(f"manual dispatch overrides the name: {name}")
          with out.open("a", encoding="utf-8") as fh:
              fh.write(f"VERSION_NAME={name}\nVERSION_CODE={code}\n")
          print(f"version from the release commit: {name} (versionCode {code})")
          EOF

      - name: Restore keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.jks"
          cat > "$GITHUB_WORKSPACE/keystore.properties" <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build release AAB
        env:
          VERSION_NAME: ${{ env.VERSION_NAME }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
        run: ./gradlew __BUNDLE_TASKS__

      - name: Upload AAB as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.VERSION_NAME }}
          path: __RELEASE_FILES__

      - name: Keep the release note inside Play's limit
        run: |
          python3 - <<'EOF'
          import pathlib
          p = pathlib.Path("__WHATSNEW_FILE__")
          if not p.exists():
              print("no whatsnew file — Play will show nothing new")
          else:
              text = p.read_text(encoding="utf-8")
              limit = __WHATSNEW_LIMIT__
              if len(text) > limit:
                  p.write_text(text[:limit], encoding="utf-8")
                  print(f"Truncated from {len(text)} to {limit} chars")
              else:
                  print(f"OK: {len(text)} chars")
          EOF

      # Staged on purpose: with no Play service account the build still goes green and
      # the AAB stays as an artifact, so a fresh project ships nothing by accident.
      - name: Upload to Play Console (internal testing)
        if: env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_JSON }}
          packageName: __PACKAGE_NAME__
          releaseFiles: __RELEASE_FILES__
          tracks: internal
          status: completed
          whatsNewDirectory: __WHATSNEW_DIR__
