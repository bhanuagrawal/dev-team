# CANONICAL CI: one signed AAB per app → Play internal testing.
#
# Every project uses this exact file; the placeholders are filled from the
# project's profile `ci` block by `devteam ci <project> --write`.
# Do not hand-edit a project's copy — change this template, then re-render all
# projects.
#
# TEMPLATE_VERSION 6 — the QA channel sends detailed tester release notes to
# Firebase App Distribution from distribution/tester-notes.md (or constructed
# fallback). Public Google Play What's New is consumer copy; Firebase App
# Distribution receives the rich changelog, verification checklist and test
# affordances so testers in the Firebase App Tester app see what changed in detail.
#
# TEMPLATE_VERSION 5 — the workflow artifact uploads are NON-FATAL. The store
# upload and the tester distribution are the deliverables; an artifact is a
# convenience. GitHub's artifact storage quota is account-wide and slow to
# recalculate, so a full quota failed both jobs before Play was ever reached
# (2026-11-17: v1.0.73 built green, no upload step ran). `continue-on-error` is
# right here because the step's own failure is already reported, and delivery
# must not depend on how much storage the account has left.
#
# TEMPLATE_VERSION 4 — the QA channel uploads with the firebase CLI, not a Docker
# action. `wzieba/Firebase-Distribution-Github-Action` is a CONTAINER action and
# GitHub refuses those on a macOS self-hosted runner ("Container action is only
# supported on Linux"); combined with `continue-on-error` the job stayed green and
# the run was reported delivered while App Distribution received nothing
# (observed 2026-11-16: v1.0.72-rc.2 reached Play internal and never reached
# testers). A `run:` step has no such limitation and its exit code is the real
# verdict, on ubuntu-latest and on the owner's Mac alike. The debug task is also a
# profile fact now: a flavored module has no `assembleDebug` (ZenList builds
# zenlist/zencoach), and the hardcoded task had no way to say so.
#
# TEMPLATE_VERSION 3 — a project that declares a self-hosted runner can build on
# it, and `devteam release` uses that when GitHub refuses the hosted jobs.
#
# Why this exists (2026-11-16): the account's Actions budget was a $0 stop, so
# every hosted job was refused in ~2s with "recent account payments have failed"
# and three releases sat tagged-but-undelivered. The block only stops PAID jobs —
# GitHub does not meter self-hosted runners, so the same workflow, the same
# secrets and the same upload step deliver normally on the owner's machine
# (proved by a real release on 2026-11-16: the stranded version reached
# `internal` from the Mac while its hosted jobs were still being refused).
#
# It is ONE JOB with a runner selector, not a second workflow: a fallback job
# with its own copy of these steps would drift, and the whole point of this file
# is that there is one shape to review. `devteam` decides when to pull the
# selector (see shipper.dispatch_local_run); a human can pull it by hand from
# Actions → Run workflow → runner: local.
#
# TEMPLATE_VERSION 2 — the version is READ FROM THE RELEASE COMMIT, not derived
# from the tag. `devteam release` writes versionName/versionCode into the version
# file and tags the commit that carries them, so there is exactly one author of
# the number (v1: CI re-derived it from the tag string and did arithmetic on it,
# which broke the moment a name carried a prerelease, e.g. 1.0.9-rc.1).
#
# WHY ONE SHAPE (owner directive 2026-10-31): projects had diverged into tag-
# triggered and bump-triggered variants, one of them carried a production-promotion
# workflow, and their upload steps differed in ways nobody could review. One trigger
# (a version tag), one job, one upload to `internal`.
#
# Production promotion is NEVER part of CI. It is a human action in Play Console.
name: Release to Play (internal)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name to build (e.g. 1.4.1). Leave empty to use the tag.'
        required: false
        type: string
      runner:
        description: 'Where to build. `local` = the self-hosted runner this project declares.'
        required: false
        type: choice
        options:
          - cloud
          - local
        default: cloud

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: __RUNS_ON_LINE__
    # Secret availability is read through an env var: `if:` cannot test a secret
    # directly, and an unset secret must mean "build only", not "fail".
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # The version is whatever the release commit stamped, verbatim. No parsing
      # of the tag, no arithmetic on the name: `1.0.9-rc.1` is a legal value and
      # `versionCode` was already allocated above Play's floor by `devteam release`.
      # A manual dispatch may still override the NAME (hotfix builds), and then the
      # committed code is reused — which is safe because a used code is caught by
      # the upload, loudly, not silently.
      - name: Read version from the release commit
        run: |
          python3 - "$GITHUB_ENV" <<'EOF'
          import pathlib, re, sys
          out = pathlib.Path(sys.argv[1])
          gf = pathlib.Path("__VERSION_FILE__")
          lines = gf.read_text(encoding="utf-8").splitlines() if gf.is_file() else []
          def line_with(word):
              return next((ln for ln in lines if word in ln), "")
          name_line, code_line = line_with("versionName"), line_with("versionCode")
          names = re.findall(r"[\"']([^\"']+)[\"']", name_line)
          version_rx = r"\d+\.\d+(\.\d+)?(-[0-9A-Za-z][0-9A-Za-z.-]*)?"
          name = next((n for n in reversed(names) if re.fullmatch(version_rx, n)), None)
          codes = re.findall(r"(?<![\w.])(\d+)(?![\w.])", code_line)
          code = codes[-1] if codes else None
          if not name or not code:
              sys.exit(f"cannot read versionName/versionCode from {gf} (name={name!r}, "
                       f"code={code!r}) - the release commit must carry both literals; "
                       "see `devteam release`")
          override = "${{ inputs.version_name }}"
          if override:
              name = override
              print(f"manual dispatch overrides the name: {name}")
          with out.open("a", encoding="utf-8") as fh:
              fh.write(f"VERSION_NAME={name}\nVERSION_CODE={code}\n")
          print(f"version from the release commit: {name} (versionCode {code})")
          EOF

      - name: Restore keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | openssl base64 -d -A > "$RUNNER_TEMP/release.jks"
          cat > "$GITHUB_WORKSPACE/keystore.properties" <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      # The Gradle wrapper downloads its distribution on every fresh runner, and
      # services.gradle.org / GitHub Releases has returned 504s and read timeouts (2026-11-08) —
      # which failed a release AFTER a green verify. Warm the wrapper with retries and a
      # mirror fallback so CI stays resilient against upstream CDN outages.
      - name: Warm the Gradle wrapper
        run: |
          for attempt in 1 2; do
            if ./gradlew --version > /dev/null 2>&1; then
              echo "wrapper ready (attempt $attempt)"; exit 0
            fi
            echo "wrapper download attempt $attempt failed; retrying in 5s"
            sleep 5
          done
          echo "primary distribution host unavailable; falling back to mirror"
          sed -i.bak -e 's|https\\://services.gradle.org/distributions/|https\\://mirrors.cloud.tencent.com/gradle/|g' \
                     -e 's|validateDistributionUrl=true|validateDistributionUrl=false|g' \
                     gradle/wrapper/gradle-wrapper.properties
          if ./gradlew --version; then
            echo "wrapper ready from mirror"; exit 0
          fi
          echo "::error::the Gradle wrapper could not be downloaded from primary or fallback mirrors"
          exit 1

      - name: Build release AAB
        env:
          VERSION_NAME: ${{ env.VERSION_NAME }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
        run: |
          sed -i.bak 's/networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true
          ./gradlew __BUNDLE_TASKS__ -Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.http.connectionTimeout=120000

      # The artifact is a convenience, never the delivery: Play is. On 2026-11-17
      # this step failed the whole job with "Artifact storage quota has been hit"
      # and the AAB never reached Play, even though the build was green — the
      # upload is non-fatal on purpose so a storage cap cannot strand a release.
      - name: Upload AAB as workflow artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: release-${{ env.VERSION_NAME }}
          path: __RELEASE_FILES__

      - name: Keep the release note inside Play's limit
        run: |
          python3 - <<'EOF'
          import pathlib
          p = pathlib.Path("__WHATSNEW_FILE__")
          if not p.exists():
              print("no whatsnew file — Play will show nothing new")
          else:
              text = p.read_text(encoding="utf-8")
              limit = __WHATSNEW_LIMIT__
              if len(text) > limit:
                  p.write_text(text[:limit], encoding="utf-8")
                  print(f"Truncated from {len(text)} to {limit} chars")
              else:
                  print(f"OK: {len(text)} chars")
          EOF

      # Staged on purpose: with no Play service account the build still goes green and
      # the AAB stays as an artifact, so a fresh project ships nothing by accident.
      - name: Upload to Play Console (internal testing)
        id: play-upload
        if: env.PLAY_JSON != ''
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_JSON }}
          packageName: __PACKAGE_NAME__
          releaseFiles: __RELEASE_FILES__
          tracks: internal
          status: completed
          whatsNewDirectory: __WHATSNEW_DIR__

      # Play refuses to let an edit be "sent for review automatically" while the app
      # has an open policy issue ("Changes cannot be sent for review automatically.
      # Please set the query parameter changesNotSentForReview to true"). The build and
      # the upload were fine — the previous run died here, after the AAB was already
      # uploaded, so the operator saw a red release with nothing to fix in the code.
      # Retry the SAME upload committing the edit WITHOUT the automatic review
      # submission: testers on `internal` get the build, and sending it for review
      # becomes an explicit, recorded step instead of a silent CI failure. Turned into
      # a loud warning so nobody reads a green run as "the store has it".
      - name: Commit the edit without sending it for review (policy hold)
        id: play-upload-hold
        if: env.PLAY_JSON != '' && steps.play-upload.outcome == 'failure'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_JSON }}
          packageName: __PACKAGE_NAME__
          releaseFiles: __RELEASE_FILES__
          tracks: internal
          status: completed
          whatsNewDirectory: __WHATSNEW_DIR__
          changesNotSentForReview: true

      - name: Say what the policy hold means
        if: env.PLAY_JSON != '' && steps.play-upload-hold.outcome == 'success'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Delivery: committed to `internal`, NOT sent for review
          Play refused the automatic review submission (an app policy issue is open),
          so the edit was committed with `changesNotSentForReview: true`.

          * Testers on the internal track can install this build.
          * The update will not reach any other track until it is sent for review:
            Play Console → Publishing overview → **Send for review**.
          * Record it: `devteam store-status <project> --state review-pending --note "..."`.

          The pipeline reads this from the console, not from this log — a green run
          here is not proof the store has the change.
          EOF
          echo "::warning::The edit was committed WITHOUT an automatic review submission — send it from Play Console → Publishing overview, then record it with devteam store-status."

#@@FIREBASE_JOB@@
  # THE QA CHANNEL (optional, per project).
  #
  # The tag that ships the release AAB to Play internal testing also ships an
  # installable DEBUG APK to Firebase App Distribution. Debug is where the
  # test-only affordances live (email/password sign-in, seeded readers, a mock
  # backend), so testers need a build they can install without a laptop — and it
  # must never be the same artifact as the store build.
  #
  # Rendered only when the profile declares ci.firebase {app_id, groups}; with no
  # credential the APK is still built and kept as an artifact, so a project that
  # has not set this up ships nothing and stays green.
  debug-to-firebase:
    runs-on: __RUNS_ON_LINE__
    env:
      FIREBASE_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # Debug builds are signed by the debug keystore Gradle generates on the
      # runner: no release keystore, no secrets, and nothing that can be published.
      # The task is a profile fact (`ci.debug_task`), because a flavored module has
      # no plain `assembleDebug`.
      - name: Build debug APK
        run: |
          sed -i.bak 's/networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true
          ./gradlew __DEBUG_TASK__ -Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.http.connectionTimeout=120000

      # The artifact name is `debug-<ref>`, and a branch ref contains `/`
      # (`dt/runner-proof`), which GitHub rejects as an artifact name — it failed
      # a branch-dispatched run of this workflow on 2026-11-16. Sanitize the ref
      # once, into the environment, instead of interpolating it into a name.
      - name: Name the artifact safely
        run: echo "REF_SAFE=$(echo "$GITHUB_REF_NAME" | tr '/' '-')" >> "$GITHUB_ENV"

      - name: Upload debug APK as workflow artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: debug-${{ env.REF_SAFE }}
          path: __DEBUG_APK__

      # THE UPLOAD IS A `run:` STEP, NOT AN ACTION. Container actions cannot run on
      # a macOS runner, and a swallowed failure there reads as a delivered build.
      # `npx firebase-tools` is the same command the team uses by hand, works on
      # every runner, and returns the upload's real exit code.
      - name: Prepare tester release notes
        if: env.FIREBASE_JSON != ''
        run: |
          NOTES_FILE="${{ runner.temp }}/firebase-release-notes.md"
          if [ -s "distribution/tester-notes.md" ]; then
            cp "distribution/tester-notes.md" "$NOTES_FILE"
          else
            echo "# Build $GITHUB_REF_NAME (${GITHUB_SHA:0:8}) — Tester Notes" > "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"
            echo "### Commit Summary" >> "$NOTES_FILE"
            git log -1 --pretty=%B >> "$NOTES_FILE" 2>/dev/null || true
            echo "" >> "$NOTES_FILE"
            echo "### Public What's New (Play Store)" >> "$NOTES_FILE"
            if [ -f "__WHATSNEW_FILE__" ]; then
              sed 's/^/> /' "__WHATSNEW_FILE__" >> "$NOTES_FILE"
            else
              echo "> Reliability and performance improvements" >> "$NOTES_FILE"
            fi
            echo "" >> "$NOTES_FILE"
            echo "### Test Affordances" >> "$NOTES_FILE"
            echo "- Test-only affordances enabled (email/password sign-in, seeded readers, mock backend)." >> "$NOTES_FILE"
          fi
          echo "TESTER_NOTES_PATH=$NOTES_FILE" >> "$GITHUB_ENV"

      - name: Share with testers (Firebase App Distribution)
        id: firebase
        if: env.FIREBASE_JSON != ''
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          printf '%s' "$FIREBASE_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes firebase-tools@15 appdistribution:distribute "__DEBUG_APK__" \
            --app "__FIREBASE_APP_ID__" \
            --groups "__FIREBASE_GROUPS__" \
            --release-notes-file "$TESTER_NOTES_PATH"

      # A green run is not proof testers were notified. When the upload step fails,
      # say so in the run itself: the AAB may already be on Play, and the only
      # thing missing is the build the testers install.
      - name: Name a distribution that did not happen
        if: env.FIREBASE_JSON != '' && steps.firebase.outcome == 'failure'
        run: |
          echo "::error::Firebase App Distribution did NOT receive this build — testers were NOT notified."
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Testers were NOT notified
          The app was built (artifact `debug-${{ env.REF_SAFE }}`) but the upload to
          Firebase App Distribution failed. The release may still have reached Play;
          this channel did not. Re-run this job after fixing the cause, or send the
          artifact by hand:
          `npx firebase-tools appdistribution:distribute <apk> --app <app-id> --groups <group>`
          EOF

      - name: Say what a missing credential means
        if: env.FIREBASE_JSON == ''
        run: echo "::warning::FIREBASE_SERVICE_ACCOUNT_JSON is unset — the debug APK was built and kept as a workflow artifact, but no tester was notified."
#@@/FIREBASE_JOB@@
