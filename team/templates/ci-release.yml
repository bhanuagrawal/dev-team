# CANONICAL CI: one signed AAB per app → Play internal testing.
#
# Every project uses this exact file; the placeholders are filled from the
# project's profile `ci` block by `devteam ci <project> --write`.
# Do not hand-edit a project's copy — change this template, then re-render all
# projects.
#
# TEMPLATE_VERSION 2 — the version is READ FROM THE RELEASE COMMIT, not derived
# from the tag. `devteam release` writes versionName/versionCode into the version
# file and tags the commit that carries them, so there is exactly one author of
# the number (v1: CI re-derived it from the tag string and did arithmetic on it,
# which broke the moment a name carried a prerelease, e.g. 1.0.9-rc.1).
#
# WHY ONE SHAPE (owner directive 2026-10-31): projects had diverged into tag-
# triggered and bump-triggered variants, one of them carried a production-promotion
# workflow, and their upload steps differed in ways nobody could review. One trigger
# (a version tag), one job, one upload to `internal`.
#
# Production promotion is NEVER part of CI. It is a human action in Play Console.
name: Release to Play (internal)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name to build (e.g. 1.4.1). Leave empty to use the tag.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Secret availability is read through an env var: `if:` cannot test a secret
    # directly, and an unset secret must mean "build only", not "fail".
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # The version is whatever the release commit stamped, verbatim. No parsing
      # of the tag, no arithmetic on the name: `1.0.9-rc.1` is a legal value and
      # `versionCode` was already allocated above Play's floor by `devteam release`.
      # A manual dispatch may still override the NAME (hotfix builds), and then the
      # committed code is reused — which is safe because a used code is caught by
      # the upload, loudly, not silently.
      - name: Read version from the release commit
        run: |
          python3 - "$GITHUB_ENV" <<'EOF'
          import pathlib, re, sys
          out = pathlib.Path(sys.argv[1])
          gf = pathlib.Path("__VERSION_FILE__")
          lines = gf.read_text(encoding="utf-8").splitlines() if gf.is_file() else []
          def line_with(word):
              return next((ln for ln in lines if word in ln), "")
          name_line, code_line = line_with("versionName"), line_with("versionCode")
          names = re.findall(r"[\"']([^\"']+)[\"']", name_line)
          version_rx = r"\d+\.\d+(\.\d+)?(-[0-9A-Za-z][0-9A-Za-z.-]*)?"
          name = next((n for n in reversed(names) if re.fullmatch(version_rx, n)), None)
          codes = re.findall(r"(?<![\w.])(\d+)(?![\w.])", code_line)
          code = codes[-1] if codes else None
          if not name or not code:
              sys.exit(f"cannot read versionName/versionCode from {gf} (name={name!r}, "
                       f"code={code!r}) - the release commit must carry both literals; "
                       "see `devteam release`")
          override = "${{ inputs.version_name }}"
          if override:
              name = override
              print(f"manual dispatch overrides the name: {name}")
          with out.open("a", encoding="utf-8") as fh:
              fh.write(f"VERSION_NAME={name}\nVERSION_CODE={code}\n")
          print(f"version from the release commit: {name} (versionCode {code})")
          EOF

      - name: Restore keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.jks"
          cat > "$GITHUB_WORKSPACE/keystore.properties" <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      # The Gradle wrapper downloads its distribution on every fresh runner, and
      # services.gradle.org / GitHub Releases has returned 504s and read timeouts (2026-11-08) —
      # which failed a release AFTER a green verify. Warm the wrapper with retries and a
      # mirror fallback so CI stays resilient against upstream CDN outages.
      - name: Warm the Gradle wrapper
        run: |
          for attempt in 1 2; do
            if ./gradlew --version > /dev/null 2>&1; then
              echo "wrapper ready (attempt $attempt)"; exit 0
            fi
            echo "wrapper download attempt $attempt failed; retrying in 5s"
            sleep 5
          done
          echo "primary distribution host unavailable; falling back to mirror"
          sed -i.bak -e 's|https\\://services.gradle.org/distributions/|https\\://mirrors.cloud.tencent.com/gradle/|g' \
                     -e 's|validateDistributionUrl=true|validateDistributionUrl=false|g' \
                     gradle/wrapper/gradle-wrapper.properties
          if ./gradlew --version; then
            echo "wrapper ready from mirror"; exit 0
          fi
          echo "::error::the Gradle wrapper could not be downloaded from primary or fallback mirrors"
          exit 1

      - name: Build release AAB
        env:
          VERSION_NAME: ${{ env.VERSION_NAME }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
        run: |
          sed -i 's/networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true
          ./gradlew __BUNDLE_TASKS__ -Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.http.connectionTimeout=120000

      - name: Upload AAB as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.VERSION_NAME }}
          path: __RELEASE_FILES__

      - name: Keep the release note inside Play's limit
        run: |
          python3 - <<'EOF'
          import pathlib
          p = pathlib.Path("__WHATSNEW_FILE__")
          if not p.exists():
              print("no whatsnew file — Play will show nothing new")
          else:
              text = p.read_text(encoding="utf-8")
              limit = __WHATSNEW_LIMIT__
              if len(text) > limit:
                  p.write_text(text[:limit], encoding="utf-8")
                  print(f"Truncated from {len(text)} to {limit} chars")
              else:
                  print(f"OK: {len(text)} chars")
          EOF

      # Staged on purpose: with no Play service account the build still goes green and
      # the AAB stays as an artifact, so a fresh project ships nothing by accident.
      - name: Upload to Play Console (internal testing)
        id: play-upload
        if: env.PLAY_JSON != ''
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_JSON }}
          packageName: __PACKAGE_NAME__
          releaseFiles: __RELEASE_FILES__
          tracks: internal
          status: completed
          whatsNewDirectory: __WHATSNEW_DIR__

      # Play refuses to let an edit be "sent for review automatically" while the app
      # has an open policy issue ("Changes cannot be sent for review automatically.
      # Please set the query parameter changesNotSentForReview to true"). The build and
      # the upload were fine — the previous run died here, after the AAB was already
      # uploaded, so the operator saw a red release with nothing to fix in the code.
      # Retry the SAME upload committing the edit WITHOUT the automatic review
      # submission: testers on `internal` get the build, and sending it for review
      # becomes an explicit, recorded step instead of a silent CI failure. Turned into
      # a loud warning so nobody reads a green run as "the store has it".
      - name: Commit the edit without sending it for review (policy hold)
        id: play-upload-hold
        if: env.PLAY_JSON != '' && steps.play-upload.outcome == 'failure'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_JSON }}
          packageName: __PACKAGE_NAME__
          releaseFiles: __RELEASE_FILES__
          tracks: internal
          status: completed
          whatsNewDirectory: __WHATSNEW_DIR__
          changesNotSentForReview: true

      - name: Say what the policy hold means
        if: env.PLAY_JSON != '' && steps.play-upload-hold.outcome == 'success'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Delivery: committed to `internal`, NOT sent for review
          Play refused the automatic review submission (an app policy issue is open),
          so the edit was committed with `changesNotSentForReview: true`.

          * Testers on the internal track can install this build.
          * The update will not reach any other track until it is sent for review:
            Play Console → Publishing overview → **Send for review**.
          * Record it: `devteam store-status <project> --state review-pending --note "..."`.

          The pipeline reads this from the console, not from this log — a green run
          here is not proof the store has the change.
          EOF
          echo "::warning::The edit was committed WITHOUT an automatic review submission — send it from Play Console → Publishing overview, then record it with devteam store-status."

#@@FIREBASE_JOB@@
  # THE QA CHANNEL (optional, per project).
  #
  # The tag that ships the release AAB to Play internal testing also ships an
  # installable DEBUG APK to Firebase App Distribution. Debug is where the
  # test-only affordances live (email/password sign-in, seeded readers, a mock
  # backend), so testers need a build they can install without a laptop — and it
  # must never be the same artifact as the store build.
  #
  # Rendered only when the profile declares ci.firebase {app_id, groups}; with no
  # credential the APK is still built and kept as an artifact, so a project that
  # has not set this up ships nothing and stays green.
  debug-to-firebase:
    runs-on: ubuntu-latest
    env:
      FIREBASE_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # Debug builds are signed by the debug keystore Gradle generates on the
      # runner: no release keystore, no secrets, and nothing that can be published.
      - name: Build debug APK
        run: |
          sed -i 's/networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true
          ./gradlew :__MODULE__:assembleDebug -Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.http.connectionTimeout=120000

      - name: Upload debug APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.ref_name }}
          path: __DEBUG_APK__

      - name: Share with testers (Firebase App Distribution)
        id: firebase
        if: env.FIREBASE_JSON != ''
        continue-on-error: true
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: __FIREBASE_APP_ID__
          serviceCredentialsFileContent: ${{ env.FIREBASE_JSON }}
          groups: __FIREBASE_GROUPS__
          file: __DEBUG_APK__
          releaseNotes: |
            Debug build ${{ github.ref_name }} — test-only affordances enabled
            (email/password sign-in, seeded readers, mock backend).
            Commit ${{ github.sha }}.

      - name: Say what a missing credential means
        if: env.FIREBASE_JSON == ''
        run: echo "::warning::FIREBASE_SERVICE_ACCOUNT_JSON is unset — the debug APK was built and kept as a workflow artifact, but no tester was notified."
#@@/FIREBASE_JOB@@
